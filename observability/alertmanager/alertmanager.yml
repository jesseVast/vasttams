global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'null'  # Default to null receiver (no alerts sent)

receivers:
  - name: 'null'
    # Null receiver - no alerts sent (configure webhook receiver as needed)
  
  - name: 'web.hook'
    webhook_configs:
      # Configure your webhook endpoint here
      # Example: - url: 'http://your-webhook-server:port/webhook'
      # Uncomment and configure when ready:
      # - url: 'http://your-webhook-server:port/webhook'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance'] 