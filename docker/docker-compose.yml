version: '3.8'

services:
  # Trino integration for vaststore SQL capabilities (development only)
  trino-vast:
    image: vastdataorg/trino-vast:latest
    profiles:
      - dev
      - full
    ports:
      - "8080:8080"
    volumes:
      - ./trino/vast.properties:/etc/trino/catalog/vast.properties
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tams-network

  # TAMS API Server
  tams-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tams-api
    ports:
      - "8000:8000"
    volumes:
      - vast_data:/app/vast_data
      - logs_data:/app/logs
      # Config file mounting - use production.json for prod, config.json for dev
      - ${CONFIG_FILE:-../config/config.json}:/etc/tams/config.json:ro
    environment:
      - TAMS_CONFIG_PATH=/etc/tams/config.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tams-network
    depends_on:
      trino-vast:
        condition: service_healthy
        required: false  # Optional dependency (only when trino-vast profile is active)

  # TAMS UI (production only)
  tams-ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ui
    container_name: tams-ui
    profiles:
      - prod
      - full
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - tams-network
    depends_on:
      - tams-api

  # HAProxy S3 Proxy (production only)
  haproxy:
    image: haproxy:latest
    container_name: tams-haproxy
    profiles:
      - prod
      - full
    ports:
      - "${HAPROXY_PORT:-4001}:80"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    dns:
      - ${HAPROXY_DNS:-10.140.3.248}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - tams-network

volumes:
  vast_data:
    driver: local
  logs_data:
    driver: local

networks:
  tams-network:
    driver: bridge
