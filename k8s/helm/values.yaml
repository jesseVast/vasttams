# Default values for tams-api
# This is a YAML-formatted file.

# Global configuration
global:
  environment: production
  imageRegistry: ""
  imagePullSecrets: []

# Image configuration
image:
  repository: tams-api
  tag: "latest"
  pullPolicy: IfNotPresent

# UI Image configuration
ui:
  enabled: true
  image:
    repository: tams-ui
    tag: "latest"
    pullPolicy: IfNotPresent

# HAProxy configuration
haproxy:
  enabled: true
  image:
    repository: haproxy
    tag: "latest"
    pullPolicy: IfNotPresent
  port: 4001
  dns: "10.140.3.248"
  # HAProxy backend servers (S3 VIPs)
  backendServers:
    - "172.200.204.1:80"
    - "172.200.204.2:80"
    - "172.200.204.3:80"
    - "172.200.204.4:80"
    - "172.200.204.5:80"
    - "172.200.204.6:80"
    - "172.200.204.7:80"

# Image pull secrets
imagePullSecrets: []

# Service account configuration
serviceAccount:
  create: true
  name: "tams-api-sa"
  annotations: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Container security context
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false  # Set to false to allow writing logs
  capabilities:
    drop:
      - ALL

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  annotations: {}

# UI Service configuration
uiService:
  type: ClusterIP
  port: 80
  targetPort: 80
  annotations: {}

# HAProxy Service configuration
haproxyService:
  type: ClusterIP
  port: 4001
  targetPort: 80
  annotations: {}

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: tams-api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: tams-api-tls
      hosts:
        - tams-api.example.com

# Horizontal Pod Autoscaler
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

# Pod Disruption Budget
pdb:
  enabled: true
  minAvailable: 1

# Network Policy
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000

# Resource limits and requests
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# UI Resource limits and requests
uiResources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

# HAProxy Resource limits and requests
haproxyResources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

# Replica count
replicaCount: 3

# Liveness and readiness probes
probes:
  liveness:
    enabled: true
    path: /health
    port: 8000
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    path: /health
    port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# VAST Database configuration
vast:
  endpoint: "http://172.200.204.1"
  bucket: "jthaloor-db"
  schema: "bbctams"
  accessKey: ""
  secretKey: ""

# Trino configuration (optional, for dev environments)
trino:
  enabled: false
  image:
    repository: vastdataorg/trino-vast
    tag: "latest"
    pullPolicy: IfNotPresent
  host: "trino-vast"
  port: 8080
  user: "admin"
  catalog: "vast"

# S3 Storage configuration
s3:
  endpointUrl: "http://tams-haproxy:80"  # Use HAProxy if enabled, otherwise direct endpoint
  bucketName: "jthaloor-s3"
  useSsl: false
  accessKeyId: ""
  secretAccessKey: ""
  rootPath: "/tams8"
  region: "us-east-1"

# Application configuration
config:
  host: "0.0.0.0"
  port: 8000
  debug: false
  logLevel: "INFO"
  logFormat: "%(asctime)s - %(name)s:%(lineno)d - %(levelname)s - %(message)s"
  logDir: "logs"  # Configurable logs directory

# Storage configuration
storage:
  defaultBackendId: "default"
  tamsStoragePath: "tams"
  tamsRoot: "/tams"
  presignedUrl:
    uploadTimeout: 3600
    downloadTimeout: 3600
  getUrlsMaxCount: 5
  flowStorageDefaultLimit: 10
  segmentStorageDefaultLimit: 10
  asyncDeletionThreshold: 1000

# TAMS Compliance configuration
tamsCompliance:
  enabled: true
  validationLevel: "strict"
  uuidValidation: true
  timestampValidation: true
  contentFormatValidation: true
  mimeTypeValidation: true
  errorReporting: true
  auditLogging: true
  cacheEnabled: true
  cacheTtl: 300

# Telemetry configuration
telemetry:
  enabled: true
  metricsEnabled: true
  tracingEnabled: true
  jaegerEndpoint: ""
  otlpEndpoint: ""

# Authentication configuration
auth:
  enabled: true
  jwtSecret: ""
  jwtAlgorithm: "HS256"
  tokenExpiration: 3600
  refreshTokenExpiration: 86400

# CORS configuration
cors:
  origins: ["*"]
  methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  headers: ["*"]

# Secrets management
secrets:
  create: true
  vastAccessKey: ""
  vastSecretKey: ""
  s3AccessKeyId: ""
  s3SecretAccessKey: ""
  jwtSecret: ""

# Persistent volumes
persistence:
  enabled: true
  logs:
    enabled: true
    size: 10Gi
    storageClassName: ""
    accessMode: ReadWriteOnce
  vastData:
    enabled: true
    size: 50Gi
    storageClassName: ""
    accessMode: ReadWriteOnce

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

# Deployment annotations
deploymentAnnotations: {}

# Deployment labels
deploymentLabels: {}
