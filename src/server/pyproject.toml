[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vasttamsserver"
version = "8.0.0"
description = "Time-addressable Media Store API"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Jesse Thaloor", email = "jthaloor@vastdata.com"}
]
keywords = ["media", "time-addressable", "fastapi", "vast", "database"]
urls = {Homepage = "https://github.com/jesseVast/vasttams"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # FastAPI and web framework
    "fastapi>=0.115.0",  # https://pypi.org/project/fastapi/
    "uvicorn[standard]>=0.34.0",  # https://pypi.org/project/uvicorn/
    "python-multipart>=0.0.20",  # https://pypi.org/project/python-multipart/
    "starlette>=0.45.0",  # https://pypi.org/project/starlette/
    
    # Data validation and settings
    "pydantic>=2.11.0",  # https://pypi.org/project/pydantic/
    "pydantic-settings>=2.10.0",  # https://pypi.org/project/pydantic-settings/
    "pydantic-core>=2.33.0",  # https://pypi.org/project/pydantic-core/
    
    # Authentication and security
    "bcrypt>=4.1.0",  # https://pypi.org/project/bcrypt/
    "PyJWT>=2.8.0",  # https://pypi.org/project/PyJWT/
    "python-jose[cryptography]>=3.3.0",  # https://pypi.org/project/python-jose/
    "passlib[bcrypt]>=1.7.0",  # https://pypi.org/project/passlib/
    
    # Environment and configuration
    "python-dotenv>=1.0.0",  # https://pypi.org/project/python-dotenv/
    "click>=8.1.0",  # https://pypi.org/project/click/
    
    # Database and ORM
    "alembic>=1.16.0",  # https://pypi.org/project/alembic/
    "psycopg2-binary>=2.9.0",  # https://pypi.org/project/psycopg2-binary/
    
    # Caching and HTTP
    "redis>=5.0.0",  # https://pypi.org/project/redis/
    "httpx>=0.28.0",  # https://pypi.org/project/httpx/
    
    # VAST database and analytics
    "vastdb>=1.3.10",  # https://pypi.org/project/vastdb/
    "ibis-framework>=9.0.0",  # https://pypi.org/project/ibis-framework/
    "pyarrow>=16.0.0",  # https://pypi.org/project/pyarrow/
    "pandas>=2.3.0",  # https://pypi.org/project/pandas/
    "duckdb>=0.9.0",  # https://pypi.org/project/duckdb/
    
    # VastStore dependencies
    "pymilvus>=2.5.0",  # https://pypi.org/project/pymilvus/
    "aioboto3>=15.0.0",  # https://pypi.org/project/aioboto3/
    "aiofiles>=24.0.0",  # https://pypi.org/project/aiofiles/
    "trino>=0.336.0",  # https://pypi.org/project/trino/
    
    # AWS/S3 storage
    "boto3>=1.39.0",  # https://pypi.org/project/boto3/
    "botocore>=1.39.0",  # https://pypi.org/project/botocore/
    "aiobotocore>=2.24.0",  # https://pypi.org/project/aiobotocore/
    
    # Additional utilities
    "python-dateutil>=2.9.0",  # https://pypi.org/project/python-dateutil/
    "pytz>=2025.0",  # https://pypi.org/project/pytz/
    "deprecated>=1.2.0",  # https://pypi.org/project/deprecated/
    "six>=1.16.0",  # https://pypi.org/project/six/
    
    # Telemetry and Observability
    "prometheus-client>=0.22.0",  # https://pypi.org/project/prometheus-client/
    "opentelemetry-api>=1.35.0",  # https://pypi.org/project/opentelemetry-api/
    "opentelemetry-sdk>=1.35.0",  # https://pypi.org/project/opentelemetry-sdk/
    "opentelemetry-instrumentation-fastapi>=0.56b0",  # https://pypi.org/project/opentelemetry-instrumentation-fastapi/
    "opentelemetry-instrumentation-httpx>=0.56b0",  # https://pypi.org/project/opentelemetry-instrumentation-httpx/
    "opentelemetry-instrumentation-logging>=0.56b0",  # https://pypi.org/project/opentelemetry-instrumentation-logging/
    "opentelemetry-exporter-prometheus>=0.56b0",  # https://pypi.org/project/opentelemetry-exporter-prometheus/
    "opentelemetry-exporter-jaeger>=1.21.0",  # https://pypi.org/project/opentelemetry-exporter-jaeger/
    "opentelemetry-exporter-otlp-proto-http>=1.15.0",  # https://pypi.org/project/opentelemetry-exporter-otlp-proto-http/
    "psutil>=7.0.0",  # https://pypi.org/project/psutil/
    
    # Private dependencies (available from GitHub releases)
    # vastdbmanager>=2.0.0 - https://github.com/jesseVast/vast/releases/download/vastdbmanager-v2.0.0/vastdbmanager-2.0.0-py3-none-any.whl
    # vasts3>=1.1.18 - https://github.com/jesseVast/vast/releases/download/vasts3-1.1.18/vasts3-1.1.18-py3-none-any.whl
    # aifuel>=0.3.3 - https://github.com/jesseVast/vast/releases/download/aifuel-v0.3.3/aifuel-0.3.3-py3-none-any.whl
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
]

[project.scripts]
tams = "vasttamsserver.main:main"

[tool.setuptools]
packages = ["vasttamsserver"]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.package-data]
vasttamsserver = ["**/*.json", "**/*.yaml", "**/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--cov=app --cov-report=term-missing"

