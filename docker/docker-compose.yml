version: '3.8'

services:
  # Redis cache service
  redis:
    image: redis:7-alpine
    container_name: tams-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - tams-network

  # Trino integration for vaststore SQL capabilities (development only)
  trino-vast:
    image: vastdataorg/trino-vast:latest
    profiles:
      - dev
      - full
    ports:
      - "8080:8080"
    volumes:
      - ./trino/vast.properties:/etc/trino/catalog/vast.properties
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tams-network

  # TAMS API Server
  tams-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tams-api
    ports:
      - "8000:8000"
    volumes:
      - vast_data:/app/vast_data
      - logs_data:/app/logs
      # Config file mounting - use production.json for prod, config.json for dev
      - ${CONFIG_FILE:-../config/config.json}:/etc/tams/config.json:ro
    environment:
      - TAMS_CONFIG_PATH=/etc/tams/config.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tams-network
    depends_on:
      trino-vast:
        condition: service_healthy
        required: false  # Optional dependency (only when trino-vast profile is active)

  # TAMS UI (production only)
  tams-ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ui
    container_name: tams-ui
    profiles:
      - prod
      - full
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - tams-network
    depends_on:
      - tams-api

  # HAProxy S3 Proxy (production only)
  haproxy:
    image: haproxy:latest
    container_name: tams-haproxy
    profiles:
      - prod
      - full
    ports:
      - "${HAPROXY_PORT:-4001}:80"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    dns:
      - ${HAPROXY_DNS:-10.140.3.248}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - tams-network

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: tams-prometheus
    profiles:
      - observability
      - full
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - tams-network
    depends_on:
      - tams-api

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: tams-grafana
    profiles:
      - observability
      - full
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    networks:
      - tams-network
    depends_on:
      - prometheus

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: tams-jaeger
    profiles:
      - observability
      - full
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # HTTP collector
      - "14250:14250"  # gRPC collector
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
    networks:
      - tams-network

  # Alertmanager for alerting
  alertmanager:
    image: prom/alertmanager:latest
    container_name: tams-alertmanager
    profiles:
      - observability
      - full
    ports:
      - "9093:9093"
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped
    networks:
      - tams-network

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: tams-node-exporter
    profiles:
      - observability
      - full
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    networks:
      - tams-network

volumes:
  vast_data:
    driver: local
  logs_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local

networks:
  tams-network:
    driver: bridge
