apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tams.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tams.labels" . | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tams.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tams.selectorLabels" . | nindent 8 }}
      {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tams.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          env:
            # Config file path
            - name: TAMS_CONFIG_PATH
              value: "/etc/tams/config.yaml"
            # VAST Database credentials
            - name: VAST_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tams.fullname" . }}-secrets
                  key: vast-access-key
            - name: VAST_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tams.fullname" . }}-secrets
                  key: vast-secret-key
            # S3 Storage credentials
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "tams.fullname" . }}-secrets
                  key: s3-access-key-id
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tams.fullname" . }}-secrets
                  key: s3-secret-access-key
            # JWT Secret
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "tams.fullname" . }}-secrets
                  key: jwt-secret
            # VAST Database configuration
            - name: VAST_ENDPOINT
              value: "{{ .Values.vast.endpoint }}"
            - name: VAST_BUCKET
              value: "{{ .Values.vast.bucket }}"
            - name: VAST_SCHEMA
              value: "{{ .Values.vast.schema }}"
            # S3 Storage configuration
            - name: S3_ENDPOINT_URL
              value: "{{ .Values.s3.endpointUrl }}"
            - name: S3_BUCKET_NAME
              value: "{{ .Values.s3.bucketName }}"
            - name: S3_USE_SSL
              value: "{{ .Values.s3.useSsl }}"
            - name: S3_REGION
              value: "{{ .Values.s3.region }}"
            # Trino configuration
            {{- if .Values.trino.enabled }}
            - name: TRINO_HOST
              value: "{{ .Values.trino.host }}"
            - name: TRINO_PORT
              value: "{{ .Values.trino.port }}"
            - name: TRINO_USER
              value: "{{ .Values.trino.user }}"
            - name: TRINO_CATALOG
              value: "{{ .Values.trino.catalog }}"
            - name: VASTSTORE_ENABLE_TRINO
              value: "true"
            {{- end }}
          volumeMounts:
            - name: tams-config
              mountPath: /etc/tams
              readOnly: true
            {{- if .Values.persistence.logs.enabled }}
            - name: logs
              mountPath: /app/logs
            {{- end }}
            {{- if .Values.persistence.vastData.enabled }}
            - name: vast-data
              mountPath: /app/vast_data
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      volumes:
        - name: tams-config
          configMap:
            name: {{ include "tams.fullname" . }}-config
        {{- if .Values.persistence.logs.enabled }}
        - name: logs
          {{- if .Values.persistence.logs.storageClassName }}
          persistentVolumeClaim:
            claimName: {{ include "tams.fullname" . }}-logs
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if .Values.persistence.vastData.enabled }}
        - name: vast-data
          {{- if .Values.persistence.vastData.storageClassName }}
          persistentVolumeClaim:
            claimName: {{ include "tams.fullname" . }}-vast-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
