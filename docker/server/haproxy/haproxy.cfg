global
    # Send logs to stdout (the container console)
    log stdout format raw local0 info
    stats socket /tmp/haproxy.sock mode 660 level admin expose-fd listeners
defaults
    log     global
    mode    http
    option  httplog
    #option  logasap
    option  dontlognull
    timeout connect 5s
    timeout client  50s
    timeout server  50s

# Define the DNS resolver we'll use for the S3 endpoint
resolvers my_dns
    nameserver dns1 10.140.3.248:53
    resolve_retries 3
    timeout retry 1s
    accepted_payload_size 8192  # <-- Add this line

frontend s3_proxy_in
    # Bind to the internal port 80
    bind *:80
    mode http

    # --- This replaces the Nginx "map" logic ---

    # 1. Create an ACL (Access Control List) to check if the
    #    'Signature' query parameter exists.
    acl is_presigned_url urlp(Signature) -m found

    # 2. Set the Host header for the S3 backend
    #    (This replaces 'proxy_set_header Host $host')
    http-request set-header Host main.selab-var204.selab.vastdata.com if is_presigned_url

    # 3. IF the ACL is true (it's a pre-signed URL),
    #    DELETE the Authorization header.
    #    OTHERWISE, do nothing (and pass the original auth header).
    #
    #    *** THIS IS THE FIX ***
    http-request del-header Authorization if is_presigned_url
    
    # --- End of dynamic logic ---

    # Send all traffic to our S3 backend
    default_backend s3_backend

backend s3_backend
    mode http
    
    # Define the S3 server and tell it to use our custom DNS resolver
    # This replaces 'proxy_pass' and the 'resolver' directive
#    server-template s3srv 8 main.selab-var204.selab.vastdata.com:80 check resolvers my_dns init-addr none
   balance random
    option abortonclose
    server vip1 172.200.204.1:80 check
    server vip2 172.200.204.2:80 check
    server vip3 172.200.204.3:80 check
    server vip4 172.200.204.4:80 check
    server vip5 172.200.204.5:80 check
    server vip6 172.200.204.6:80 check
    server vip7 172.200.204.7:80 check
